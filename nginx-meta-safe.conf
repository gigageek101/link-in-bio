# Nginx Configuration for Meta-Safe SearchForMyLinks
# This ensures HTTP 301 permanent redirects with no tracking

# Force HTTPS globally
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;
    
    # SSL Configuration
    ssl_certificate /etc/ssl/certs/your-cert.crt;
    ssl_certificate_key /etc/ssl/private/your-key.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(),microphone=(),camera=()" always;
    
    # Root directory
    root /var/www/searchformylinks;
    index index.html;
    
    # Serve static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # API Routes - No caching
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache";
    }
    
    # CRITICAL: Safe Redirect Handler (301 Permanent)
    # NO tracking parameters, NO JavaScript
    location /redirect {
        # Whitelist query parameters only (no PII, no fingerprinting)
        if ($query_string ~ "^target=(telegram|twitter|onlyfans)$") {
            # Get the target
            set $redirect_target $arg_target;
            
            # Map to actual URLs (no tracking params)
            if ($redirect_target = "telegram") {
                return 301 https://t.me/allisonsworld;
            }
            if ($redirect_target = "twitter") {
                return 301 https://x.com/girlie_allie;
            }
            if ($redirect_target = "onlyfans") {
                return 301 https://onlyfans.com/allison-gray/c35;
            }
        }
        
        # Invalid redirect
        return 400;
    }
    
    # Safe redirect endpoint (alternative)
    location /safe-redirect {
        if ($query_string ~ "target=(.+)$") {
            set $target $arg_target;
        }
        # Decode and validate (done in Node.js backend)
        proxy_pass http://localhost:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    # Compliance Files
    location = /robots.txt {
        alias /var/www/searchformylinks/robots.txt;
        add_header Cache-Control "public, max-age=86400";
    }
    
    location = /meta-safe.txt {
        alias /var/www/searchformylinks/meta-safe.txt;
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "text/plain";
    }
    
    # Privacy and Terms (noindex)
    location ~ ^/(privacy|terms|contact)$ {
        try_files $uri.html $uri/ =404;
        add_header X-Robots-Tag "noindex";
    }
    
    # Disable image indexing for gallery
    location ~ /images/ {
        add_header X-Robots-Tag "noimageindex";
        expires 7d;
    }
    
    # Main profile (with noimageindex)
    location = / {
        try_files /allisonsundress.html =404;
        add_header X-Robots-Tag "noimageindex,nosnippet";
        add_header Cache-Control "public, max-age=3600";
    }
    
    # 404
    error_page 404 /404.html;
    
    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }
    
    location ~ ~$ {
        deny all;
    }
}

# Optional: Subdomain setup for multi-user (future scaling)
# This separates user profiles for better trust scoring
server {
    listen 443 ssl http2;
    server_name *.searchformylinks.com;
    
    ssl_certificate /etc/ssl/certs/wildcard-cert.crt;
    ssl_certificate_key /etc/ssl/private/wildcard-key.key;
    
    # Extract username from subdomain
    set $user_subdomain $host;
    if ($user_subdomain ~* ^([^.]+)\.searchformylinks\.com$) {
        set $user_subdomain $1;
    }
    
    # Route to user profile
    root /var/www/searchformylinks/profiles/$user_subdomain;
    try_files $uri $uri.html $uri/ =404;
    
    # Same security headers as main domain
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noimageindex,nosnippet";
}
